
services:
  music_eventsim:
    build:
      context: ./eventsim
      dockerfile: Dockerfile
    container_name: music_eventsim
    networks:
      - music-net
    depends_on:
      music_kafka:
        condition: service_healthy
    command: >
      -c examples/example-config.json
      --start-time "2026-01-01T00:00:00"
      --end-time "2026-12-31T23:59:59"
      --nusers 20
      --growth-rate 0
      --kafkaBrokerList music_kafka:29092
      --continuous
    restart: on-failure
  music_zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: music_zookeeper
    restart: unless-stopped
    networks:
      - music-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    volumes:
      - ./volumes/zookeeper:/var/lib/zookeeper/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
  music_kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: music_kafka
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_zookeeper:
        condition: service_healthy
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: music_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://music_kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - ./volumes/kafka:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
  music_apicurio:
    image: apicurio/apicurio-registry-mem:latest-release
    container_name: music_apicurio
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_kafka:
        condition: service_healthy
    ports:
      - "8095:8080"
    mem_limit: 512m
  music_kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: music_kafka_ui
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_kafka:
        condition: service_healthy
      music_apicurio:
        condition: service_started
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: music-stream-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: music_kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://music_apicurio:8080/apis/registry/v2
    mem_limit: 512m
  music_postgres:
    image: postgres:13
    container_name: music_postgres
    restart: unless-stopped
    networks:
      - music-net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  music_airflow_init:
    image: apache/airflow:2.8.1
    container_name: music_airflow_init
    networks:
      - music-net
    depends_on:
      music_postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@music_postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@musicstream.io
    restart: "no"
  music_airflow_webserver:
    image: apache/airflow:2.8.1
    container_name: music_airflow_webserver
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_postgres:
        condition: service_healthy
      music_airflow_init:
        condition: service_completed_successfully
    ports:
      - "8084:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@music_postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "musicstream-secret-key-change-in-prod"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: webserver
  music_airflow_scheduler:
    image: apache/airflow:2.8.1
    container_name: music_airflow_scheduler
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_postgres:
        condition: service_healthy
      music_airflow_init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@music_postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "musicstream-secret-key-change-in-prod"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    mem_limit: 512m
    command: scheduler
  music_spark_master:
    image: apache/spark:3.5.1
    container_name: music_spark_master
    restart: unless-stopped
    networks:
      - music-net
    environment:
      - SPARK_MASTER_HOST=music_spark_master
      - SPARK_LOCAL_IP=music_spark_master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "7077:7077"
      - "8083:8080"
    volumes:
      - ./spark/jobs:/opt/bitnami/spark/jobs
    mem_limit: 512m
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://music_spark_master:8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  music_spark_worker:
    image: apache/spark:3.5.1
    container_name: music_spark_worker
    restart: unless-stopped
    networks:
      - music-net
    depends_on:
      music_spark_master:
        condition: service_healthy
    environment:
      - SPARK_MASTER_URL=spark://music_spark_master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_LOCAL_IP=music_spark_worker
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./spark/jobs:/opt/bitnami/spark/jobs
    mem_limit: 1200m
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://music_spark_master:7077"]

networks:
  music-net:
    driver: bridge